[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceiosim"
version = "0.1.0"
description = "Experiment harness for ceio-sim (CEIO, Toasty, CEIO-W)"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ceiosim*"]
